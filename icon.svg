<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#171827"/><stop offset="1" stop-color="#090a12"/>
  </linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#d0baff"/><stop offset=".52" stop-color="#a17aff"/><stop offset="1" stop-color="#7040d7"/>
  </linearGradient>
  <radialGradient id="starGlow">
    <stop offset="0" stop-color="#a47aff" stop-opacity=".45"/><stop offset="1" stop-color="#a47aff" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="22"/>
  </filter>
</defs>
<!-- Transparent-ready icon background; remove this rect for transparent export -->
<rect width="1024" height="1024" rx="190" fill="url(#bg)"/>
<circle cx="512" cy="512" r="210" fill="url(#starGlow)" filter="url(#soft)"/>
<!-- Three atomic orbital paths, rotated around the central star -->
<g fill="none" stroke="url(#violet)" stroke-width="15" opacity=".96">
  <ellipse cx="512" cy="512" rx="355" ry="135" transform="rotate(-32 512 512)"/>
  <ellipse cx="512" cy="512" rx="355" ry="135" transform="rotate(32 512 512)"/>
  <ellipse cx="512" cy="512" rx="355" ry="135" transform="rotate(90 512 512)"/>
</g>
<!-- Central four-point spark -->
<path d="M512 337
 C536 458 566 488 687 512
 C566 536 536 566 512 687
 C488 566 458 536 337 512
 C458 488 488 458 512 337Z"
 fill="url(#violet)" stroke="#e4d8ff" stroke-width="7" stroke-linejoin="round"/>
<path d="M512 398 C528 474 550 496 626 512 C550 528 528 550 512 626 C496 550 474 528 398 512 C474 496 496 474 512 398Z"
 fill="#f8f5ff" opacity=".95"/>
<!-- Electron particles placed on distinct orbit positions -->
<g fill="#fff" stroke="#8f68f0" stroke-width="8">
  <circle cx="827" cy="333" r="24"/>
  <circle cx="197" cy="512" r="24"/>
  <circle cx="512" cy="157" r="24"/>
</g>
</svg>
